[program:ivision-worker]

process_name=%(program_name)s_%(process_num)02d

command=/usr/bin/php /var/www/ivision/api/artisan queue:work database --queue=communications,default --sleep=3 --tries=3 --timeout=90 --max-time=3600

directory=/var/www/ivision/api

autostart=true

autorestart=true

stopasgroup=true

killasgroup=true

user=www-data

numprocs=2

redirect_stderr=true

stdout_logfile=/var/log/ivision-worker.log

stdout_logfile_maxbytes=20MB

stdout_logfile_backups=5

stopwaitsecs=120