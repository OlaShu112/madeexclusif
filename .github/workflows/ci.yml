name: IVISION Continuous Integration

on:
  push:
    branches:
      - development
      - staging
      - main

  pull_request:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

jobs:

  backend:

    name: Laravel Backend Tests

    runs-on: ubuntu-latest

    services:

      mariadb:

        image: mariadb:10.11

        env:
          MARIADB_DATABASE: ivision_testing
          MARIADB_USER: ivision_test
          MARIADB_PASSWORD: ci_test_password
          MARIADB_ROOT_PASSWORD: ci_root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: api

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ivision_testing
      DB_USERNAME: ivision_test
      DB_PASSWORD: ci_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Verify database configuration
        run: |
          php artisan tinker --execute='
          if (config("database.connections.mysql.database") !== "ivision_testing") {
              exit(1);
          }'

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run backend tests
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit

  frontend:

    name: Vue Frontend Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high